<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atende AI · teste do chat</title>
    <style>
      :root { --cor: #4f46e5; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #f4f4f5; display: grid; place-items: center; min-height: 100vh; }
      .chat { width: min(420px, 100vw); height: min(640px, 100vh); background: #fff; border-radius: 16px; box-shadow: 0 10px 40px #0002; display: flex; flex-direction: column; overflow: hidden; }
      header { background: var(--cor); color: #fff; padding: 14px 18px; font-weight: 600; }
      header small { display: block; font-weight: 400; opacity: .85; }
      #mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
      .bot { background: #f1f1f3; align-self: flex-start; border-bottom-left-radius: 4px; }
      .eu { background: var(--cor); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
      .erro { background: #fee2e2; color: #991b1b; }
      form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
      input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; font: inherit; }
      button { background: var(--cor); color: #fff; border: 0; border-radius: 10px; padding: 0 16px; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <div class="chat">
      <header><span id="titulo">Carregando…</span><small id="subtitulo"></small></header>
      <div id="mensagens"></div>
      <form id="form">
        <input id="entrada" placeholder="Escreva sua mensagem" autocomplete="off" maxlength="2000" />
        <button id="enviar">Enviar</button>
      </form>
    </div>
    <script>
      // Página só para testar a API local. O widget de verdade vem na etapa 4.
      const slug = new URLSearchParams(location.search).get('empresa') || 'padaria-demo';
      const chaveConversa = `atende-ai:${slug}:conversa`;
      let conversaId = sessionStorage.getItem(chaveConversa) || undefined;

      const lista = document.getElementById('mensagens');
      const entrada = document.getElementById('entrada');
      const botao = document.getElementById('enviar');

      function balao(texto, classe) {
        const el = document.createElement('div');
        el.className = `msg ${classe}`;
        el.textContent = texto;
        lista.append(el);
        lista.scrollTop = lista.scrollHeight;
        return el;
      }

      async function carregar() {
        const r = await fetch(`/api/chat/${slug}/config`);
        if (!r.ok) {
          document.getElementById('titulo').textContent = `Empresa "${slug}" não encontrada`;
          return;
        }
        const c = await r.json();
        document.documentElement.style.setProperty('--cor', c.corPrimaria);
        document.getElementById('titulo').textContent = c.nomeBot;
        document.getElementById('subtitulo').textContent = c.nome;
        balao(c.mensagemBoasVindas, 'bot');
      }

      document.getElementById('form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const mensagem = entrada.value.trim();
        if (!mensagem) return;
        entrada.value = '';
        botao.disabled = true;
        balao(mensagem, 'eu');
        const resposta = balao('…', 'bot');
        let texto = '';

        try {
          const r = await fetch(`/api/chat/${slug}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensagem, conversaId }),
          });
          if (!r.ok) throw new Error((await r.json()).mensagem);

          // Lê o stream SSE: cada evento é uma linha "data: {...}" seguida de linha em branco.
          const leitor = r.body.pipeThrough(new TextDecoderStream()).getReader();
          let buffer = '';
          for (;;) {
            const { value, done } = await leitor.read();
            if (done) break;
            buffer += value;
            const blocos = buffer.split('\n\n');
            buffer = blocos.pop();
            for (const bloco of blocos) {
              const ev = JSON.parse(bloco.replace(/^data: /, ''));
              if (ev.tipo === 'inicio') {
                conversaId = ev.conversaId;
                sessionStorage.setItem(chaveConversa, conversaId);
              } else if (ev.tipo === 'texto') {
                texto += ev.texto;
                resposta.textContent = texto;
                lista.scrollTop = lista.scrollHeight;
              } else if (ev.tipo === 'erro') {
                resposta.textContent = ev.mensagem;
                resposta.classList.add('erro');
              }
            }
          }
        } catch (e) {
          resposta.textContent = e.message || 'Falha de conexão.';
          resposta.classList.add('erro');
        } finally {
          botao.disabled = false;
          entrada.focus();
        }
      });

      carregar();
    </script>
  </body>
</html>
